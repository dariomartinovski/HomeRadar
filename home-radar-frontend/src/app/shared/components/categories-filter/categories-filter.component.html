<div class="categories-icons">
    @for (perkType of categories(); track $index) {
    <div class="icon">
        @if (expanded()) {
        <p>{{perkType | capitalize}}</p>
        }
        <input
            type="checkbox"
            [id]="perkType"
            [checked]="isChecked(perkType)"
            (change)="toggleCategory(perkType, $event)"
            >
        <img [src]="perkType | perkIconUrl" [alt]="perkType">
    </div>
    }
</div>
