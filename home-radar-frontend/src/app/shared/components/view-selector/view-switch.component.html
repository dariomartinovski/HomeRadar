<div class="view-selector-container">
  <button
    [ngClass]="(viewType() === ViewTypeEnum.MAP_VIEW ? 'selected ' : 'not-selected ') + 'map-view'"
    [title]='ViewTypeEnum.MAP_VIEW | capitalize'
    (click)="handleViewSwitch(ViewTypeEnum.MAP_VIEW)">
    <mat-icon class="icon">map</mat-icon>
  </button>
  <button
    [ngClass]="(viewType() === ViewTypeEnum.LIST_VIEW ? 'selected ' : 'not-selected ') + 'list-view'"
    [title]='ViewTypeEnum.LIST_VIEW | capitalize'
    (click)="handleViewSwitch(ViewTypeEnum.LIST_VIEW)">
    <mat-icon class="icon">list</mat-icon>
  </button>
</div>
