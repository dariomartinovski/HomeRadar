<div class="advanced-filters-container">
  <h3>Advanced Filters</h3>

  <form [formGroup]="advancedFiltersForm" (ngSubmit)="applyFilters()">
    <mat-form-field appearance="outline">
      <mat-label>Property Type</mat-label>
      <mat-select formControlName="propertyCategory">
        <mat-option [value]="null">Any</mat-option>
        <mat-option value="FOR_RENT">For Rent</mat-option>
        <mat-option value="FOR_SALE">For Sale</mat-option>
      </mat-select>
    </mat-form-field>

    <div></div>

    <mat-form-field appearance="outline">
      <mat-label>Price From</mat-label>
      <input matInput type="number" formControlName="priceMin">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price To</mat-label>
      <input matInput type="number" formControlName="priceMax">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Min. Rooms</mat-label>
      <input matInput type="number" formControlName="rooms" min="0">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Min. Bedrooms</mat-label>
      <input matInput type="number" formControlName="bedrooms" min="0">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Min. Bathrooms</mat-label>
      <input matInput type="number" formControlName="bathrooms" min="0">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Min. Size (m²)</mat-label>
      <input matInput type="number" formControlName="size" min="0" step="0.01">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Built After</mat-label>
      <input matInput type="number" formControlName="yearBuilt" min="0">
    </mat-form-field>

    <div></div>

    <div class="checkboxes">
      <mat-checkbox formControlName="parking">Parking</mat-checkbox>
      <mat-checkbox formControlName="balcony">Balcony</mat-checkbox>
      <mat-checkbox formControlName="elevator">Elevator</mat-checkbox>
    </div>

    <div class="form-actions">
      <button mat-raised-button color="primary" type="submit">Apply Filters</button>
      <button mat-stroked-button color="warn" type="button" (click)="resetFilters()">Reset</button>
    </div>
  </form>
</div>
