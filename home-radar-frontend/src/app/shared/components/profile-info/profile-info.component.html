 <div class="profile-container">
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar">{{user?.firstName?.at(0)}} {{user?.lastName?.at(0)}}</div>
          <div>
            <h1 class="profile-title">{{user?.firstName}} {{user?.lastName}}</h1>
            <p class="profile-subtitle">{{user?.role}}</p>
          </div>
        </div>

        <div class="profile-info">
          <div class="info-group">
            <span class="info-label">First Name</span>
            <div class="info-value">{{user?.firstName}}</div>
          </div>

          <div class="info-group">
            <span class="info-label">Last Name</span>
            <div class="info-value">{{user?.lastName}}</div>
          </div>

          <div class="info-group">
            <span class="info-label">Email Address</span>
            <div class="info-value">{{user?.email}}</div>
          </div>
          <div class="info-group">
            <span class="info-label">Phone Number</span>
            <div class="info-value">{{user?.phoneNumber}}</div>
          </div>
        </div>
      </div>
      </div>
