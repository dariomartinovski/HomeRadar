<div class="property-list-container">
  @if (sortedProperties.length === 0) {
    <div class="no-properties">
      <p>No properties found matching your criteria.</p>
    </div>
  } @else {
    <div class="list-header">
      <div class="results-count">
        <span class="count">{{ sortedProperties.length }}</span>
        <span class="label">{{ sortedProperties.length === 1 ? 'Property' : 'Properties' }}</span>
      </div>

      <div class="sort-controls">
        <label for="sort-select">Sort by:</label>
        <select
          id="sort-select"
          [(ngModel)]="selectedSort"
          (change)="onSortChange()"
          class="sort-dropdown">
          @for (option of sortOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
    </div>

    <div class="properties-grid">
      @for (property of displayedProperties; track property.id) {
        <property-list-card
          [property]="property"
          (cardClick)="onPropertyClick($event)">
        </property-list-card>
      }
    </div>

    @if (hasMoreProperties) {
      <div class="load-more-section">
        <button class="load-more-btn" (click)="loadMore()">
          <span class="btn-text">Load More Properties</span>
          <span class="remaining-count">({{ remainingCount }} remaining)</span>
        </button>
      </div>
    }
  }
</div>
