<div class="admin-panel-container">
  <h1>Admin Panel</h1>

  <mat-tab-group animationDuration="300ms">
    <mat-tab label="Property">
      <ng-template matTabContent>
        <div class="tab-content">
          <property-form
            [user]="user!"
          ></property-form>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Perk">
      <ng-template matTabContent>
        <div class="tab-content">
          <div class="perk-forms-container">
            <perk-type-form></perk-type-form>
            <perk-form></perk-form>
          </div>
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
