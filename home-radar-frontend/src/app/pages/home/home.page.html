<div class="container">
    <div class="search-container">
        <search></search>
    </div>
    <div class="map-container">
        <map-component 
            [properties]="properties()"
            [perks]="perks()"
            (selectedProperty)="handlePropertyClick($event)">
        </map-component>
    </div>
    <categories-filter
        [categories]="categories()"
    ></categories-filter>
    <property-details
        [property]="selectedProperty"
        (closePopup)="selectedProperty = undefined"
    ></property-details>
</div>
