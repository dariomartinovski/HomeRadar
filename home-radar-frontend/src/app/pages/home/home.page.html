<div class="container">
    @if((perks$ | async); as perks){
        <div class="map-container">
            <map-component 
                [properties]="mockProperties"
                [perks]="perks"
                (selectedProperty)="handlePropertyClick($event)">
            </map-component>
        </div>
    }
    <property-details
        [property]="selectedProperty"
        (closePopup)="selectedProperty = undefined"
    ></property-details>
</div>
